<section class="hero-section">
  <div class="headline-container">
    <h2 class="fira-code">{{ "HERO.ROLE" | translate }}</h2>
    <h1 class="karla">{{ "HERO.NAME" | translate }}</h1>
  </div>

  <div class="button-container">
    <div class="hero-button" (click)="scrollToAnchor('projects')">
      <p
        class="animated-text"
        [attr.data-text]="'HERO.PROJECTS_BTN' | translate"
      >
        {{ "HERO.PROJECTS_BTN" | translate }}
      </p>
    </div>

    <div class="hero-button" (click)="scrollToAnchor('contact')">
      <p
        class="animated-text"
        [attr.data-text]="'HERO.CONTACT_BTN' | translate"
      >
        {{ "HERO.CONTACT_BTN" | translate }}
      </p>
    </div>
  </div>

  <div class="banner">
    <div class="marquee">
      <div class="marquee__inner">
        @for (i of [1, 2, 3, 4]; track i) {
          @for (itemKey of marqueeItems; track itemKey) {
            <p class="karla">{{ itemKey | translate }}</p>
            <img
              class="spaceholder"
              src="../../assets/img/banner-space.svg"
              alt=""
            />
          }
        }
      </div>
    </div>
  </div>

  <div class="decoration-container">
    <div class="decoration-hero-left">
      <div class="scroll-arrow-container">
        <img
          class="scroll-down"
          src="../../assets/img/scroll-down.svg"
          alt=""
        />
      </div>
      <div class="decoration-line-left"></div>
    </div>

    <div class="decoration-hero-right">
      <a [href]="'mailto:' + email" class="email-link karla">{{ email }}</a>
      <div class="link-icon-containter">
        <a href="https://github.com/SebastianBoehme" target="_blank">
          <div class="github-icon"></div>
        </a>
        <a
          href="https://www.linkedin.com/in/sebastian-b%C3%B6hme-b91349302/"
          target="_blank"
        >
          <div class="linkedin-icon"></div>
        </a>
      </div>
      <div class="decoration-line-right"></div>
    </div>
  </div>
</section>
